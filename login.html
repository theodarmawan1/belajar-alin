<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Masuk - Aljabar Linear Interaktif</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- App CSS for styling variables -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image: var(--bg-app);
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Background glow spheres */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.15;
        }
        .glow-sphere-1 {
            width: 300px;
            height: 300px;
            background: var(--indigo);
            top: -100px;
            left: -100px;
        }
        .glow-sphere-2 {
            width: 400px;
            height: 400px;
            background: var(--purple);
            bottom: -150px;
            right: -150px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), var(--shadow-glow-purple);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--purple) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
            color: #fff;
        }

        .login-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color var(--trans-fast);
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all var(--trans-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--purple);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--purple) 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all var(--trans-fast);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.6;
        }

        /* Inline Error Alert */
        .error-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Spinner for loading state */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Glow effects -->
    <div class="glow-sphere glow-sphere-1"></div>
    <div class="glow-sphere glow-sphere-2"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <!-- Lucide Lock Icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2>Restricted Access</h2>
            <p>Silakan masuk menggunakan akun Anda</p>
        </div>

        <!-- Error Container -->
        <div class="error-alert" id="login-error">
            <!-- Lucide Alert Circle Icon SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span id="error-message">Username atau password salah!</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" required autocomplete="username" placeholder="Masukkan username">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" required autocomplete="current-password" placeholder="Masukkan password">
            </div>

            <button class="btn-submit" type="submit" id="submit-btn">
                <span class="spinner" id="btn-spinner"></span>
                <span id="btn-text">Masuk</span>
            </button>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorAlert = document.getElementById('login-error');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnText = document.getElementById('btn-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            errorAlert.style.display = 'none';
            
            // Set loading state
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.textContent = 'Memverifikasi...';

            const username = usernameInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirect back to root after successful login
                    window.location.href = '/';
                } else {
                    // Show error message
                    errorMessage.textContent = data.message || 'Gagal masuk. Coba lagi.';
                    errorAlert.style.display = 'flex';
                    
                    // Reset loading state
                    submitBtn.disabled = false;
                    btnSpinner.style.display = 'none';
                    btnText.textContent = 'Masuk';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMessage.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi.';
                errorAlert.style.display = 'flex';
                
                // Reset loading state
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = 'Masuk';
            }
        });
    </script>
</body>
</html>
